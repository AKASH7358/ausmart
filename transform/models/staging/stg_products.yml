version: 2

models:
  - name: stg_products
    description: "Deduplicated product data from raw S3 ingestion"
    columns:
      - name: product_id
        description: "Unique product identifier"
        data_tests:
          - unique 
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - accepted_values:
              values: ['AUD']

  - name: stg_prices
    description: "Deduplicated price data with discount calculations"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique 
      - name: price
        data_tests:
          - not_null
